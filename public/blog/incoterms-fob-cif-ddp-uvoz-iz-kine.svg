<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b33"/><stop offset="1" stop-color="#0e6490"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<text x="60" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="800" fill="#fff">FOB, CIF ili DDP?</text>
<text x="60" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#cbd5e1">Ko plaća šta i ko snosi rizik</text>
<g transform="translate(120 220)">
<rect width="960" height="340" rx="22" fill="#fff" opacity=".08" stroke="#fff" stroke-opacity=".25"/>
<g font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#0b1b33" text-anchor="middle">
<rect x="60" y="40" width="250" height="70" rx="14" fill="#e5e7eb"/><text x="185" y="86">FOB</text>
<rect x="355" y="40" width="250" height="70" rx="14" fill="#e5e7eb"/><text x="480" y="86">CIF</text>
<rect x="650" y="40" width="250" height="70" rx="14" fill="#facc15"/><text x="775" y="86">DDP</text>
</g>
<g font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#cbd5e1" text-anchor="middle">
<text x="185" y="150">do ukrcaja na brod</text><text x="480" y="150">+ more i osiguranje</text><text x="775" y="150" fill="#facc15">sve do vaših vrata</text>
</g>
<line x1="60" y1="230" x2="870" y2="230" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-dasharray="14 10"/>
<circle cx="60" cy="230" r="14" fill="#e5e7eb"/><circle cx="480" cy="230" r="14" fill="#e5e7eb"/><circle cx="870" cy="230" r="14" fill="#facc15"/>
<g font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#fff" text-anchor="middle"><text x="60" y="282">Kina</text><text x="480" y="282">Ploče</text><text x="870" y="282">Vaša adresa</text></g>
</g>
</svg>
