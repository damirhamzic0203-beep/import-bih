<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1b33"/><stop offset="1" stop-color="#0e6490"/></linearGradient></defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<text x="60" y="100" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="800" fill="#fff">Uvoz mašina iz Kine</text>
<text x="60" y="148" font-family="Segoe UI,Arial,sans-serif" font-size="28" fill="#cbd5e1">Na šta paziti prije narudžbe</text>
<!-- big gear -->
<g transform="translate(830 360)">
<g fill="#facc15">
<circle r="120"/>
<g id="t"><rect x="-22" y="-160" width="44" height="50" rx="6"/></g>
<use href="#t" transform="rotate(45)"/><use href="#t" transform="rotate(90)"/><use href="#t" transform="rotate(135)"/><use href="#t" transform="rotate(180)"/><use href="#t" transform="rotate(225)"/><use href="#t" transform="rotate(270)"/><use href="#t" transform="rotate(315)"/>
</g>
<circle r="56" fill="#0b1b33"/><circle r="30" fill="#0e6490"/>
</g>
<!-- small gear -->
<g transform="translate(560 470)">
<g fill="#e5e7eb"><circle r="62"/>
<g id="s"><rect x="-12" y="-86" width="24" height="26" rx="4"/></g>
<use href="#s" transform="rotate(60)"/><use href="#s" transform="rotate(120)"/><use href="#s" transform="rotate(180)"/><use href="#s" transform="rotate(240)"/><use href="#s" transform="rotate(300)"/></g>
<circle r="26" fill="#0b1b33"/>
</g>
<!-- saw blade -->
<g transform="translate(1040 190)">
<circle r="70" fill="#9ca3af"/><circle r="70" fill="none" stroke="#e5e7eb" stroke-width="10" stroke-dasharray="6 9"/><circle r="22" fill="#0b1b33"/>
</g>
<!-- checklist -->
<g font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#fff">
<text x="60" y="270">✓ Specifikacija i napon</text><text x="60" y="325">✓ Provjera dobavljača</text><text x="60" y="380">✓ HS kod i carina</text><text x="60" y="435">✓ Istovar i transport</text><text x="60" y="490">✓ Garancija i servis</text>
</g>
</svg>
